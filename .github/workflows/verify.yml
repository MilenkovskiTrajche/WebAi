name: Verify website and printable menus
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: git diff --exit-code -- public/menu
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
